[project]
name = "corsaallultimacampanella"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "platformdirs>=4.9.4",
    "pygame>=2.6.1",
]

[project.scripts]
corsaallultimacampanella = "corsaallultimacampanella:main"

[build-system]
requires = ["uv_build>=0.9.27,<0.10.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "src/corsaallultimacampanella/corsaallultimacampanella",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.19.0",
]
